[project]
name = "enterprise-rag"
version = "1.0.0"
description = "企业知识助手 RAG —— 混合检索 + 带引用多轮对话 + 增量索引 + 评估体系"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# 让 pytest 在任何目录运行都能 import backend
pythonpath = ["."]
testpaths = ["tests"]
# integration 标记的用例需要真实 API key,默认全部跳过(CI 无 key 也全绿)
markers = [
    "integration: 需真实 API key(DeepSeek / DashScope),默认跳过",
]
addopts = "-m 'not integration'"
